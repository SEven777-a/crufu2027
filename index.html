<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRUFU 2027 隊內追蹤</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg: #0e0f12; --card: #1a1c21; --card2: #23262d; --line: #2c2f37;
  --text: #f2f3f5; --muted: #a8adb7;
  --accent: #fbbf24; --accent-ink: #111; --accent-bg: #3b2a0a;
  --car1: #e5484d; --car2: #3b82f6;
  --low: #22c55e; --mid: #f59e0b; --hard: #ef4444;
  --fast: #22c55e; --slow: #f97316;
  --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
body { overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* 分頁與底部導覽 */
.tab { display: none; position: absolute; inset: 0 0 calc(var(--nav-h) + env(safe-area-inset-bottom)) 0;
  overflow-y: auto; padding: calc(12px + env(safe-area-inset-top)) 16px 24px; }
.tab.active { display: block; }
#tab-map { padding: 0; overflow: hidden; }
nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); display: flex; background: #15171b; border-top: 1px solid var(--line); z-index: 1000; }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--muted); }
nav button svg { width: 24px; height: 24px; }
nav button.active { color: var(--accent); }

/* 示範模式橫幅 */
.demo-bar { background: var(--accent-bg); color: var(--accent); font-size: 13px; padding: 8px 12px; border-radius: 10px;
  margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.demo-bar button { color: var(--accent); text-decoration: underline; font-size: 13px; white-space: nowrap; }
#tab-map .demo-bar { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 500; margin: 0; }

/* 卡片 */
h1 { font-size: 26px; margin: 4px 0 12px; }
h1::before { content: ""; display: block; width: 28px; height: 4px; border-radius: 2px; background: var(--accent); margin-bottom: 8px; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 20px 0 8px; }
.card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; }
.chip.低 { color: var(--low); } .chip.中 { color: var(--mid); } .chip.難 { color: var(--hard); }
.chip.plain { color: var(--muted); }
.btn { display: block; width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 16px; text-align: center; }
.btn.ghost { background: var(--card2); color: var(--text); }
.btn.warn { background: transparent; color: var(--slow); border: 1px solid var(--slow); }
.btn:disabled { opacity: .4; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--card2); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--muted); }
.kv { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv:last-child { border-bottom: 0; }
.fast { color: var(--fast); } .slow { color: var(--slow); }

/* 大卡（目前跑者、我的下一棒） */
.hero { border-radius: 18px; padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
.hero.car1 { background: var(--car1); } .hero.car2 { background: var(--car2); } .hero.idle { background: var(--card2); }
.hero .label { font-size: 13px; opacity: .85; }
.hero .big { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
.hero .name { font-size: 26px; font-weight: 800; }
.bar { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin: 12px 0 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.hero .btn { margin-top: 14px; }
.hero .btn:not(.ghost):not(.warn) { background: #fff; color: #111; }

/* 棒次列表 */
.leg { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border-radius: 14px;
  margin-bottom: 8px; width: 100%; text-align: left; }
.leg.done { opacity: .55; }
.leg.run { outline: 2px solid var(--text); }
.leg.mine { box-shadow: inset 4px 0 0 var(--accent); }
.badge { flex: none; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; color: #fff; }
.badge.car1 { background: var(--car1); } .badge.car2 { background: var(--car2); }
.leg .mid { flex: 1; min-width: 0; }
.leg .t { font-size: 13px; color: var(--muted); margin-top: 2px; }
.leg .right { text-align: right; font-size: 14px; }
.round-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 16px 2px 8px; }
.issues { background: #3b1515; color: #fca5a5; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }

/* 地圖 */
#map { position: absolute; inset: 0; background: #1b1d22; }
.map-card { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 500;
  background: rgba(20,22,26,.92); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(6px); }
.map-btns { position: absolute; right: 10px; bottom: 70px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
.map-btns button { background: rgba(20,22,26,.92); border-radius: 12px; padding: 8px 10px; font-size: 12px; }
.map-btns button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
/* 隊友小頭像：頭像＋名字·幾分鐘前；自己用黃框 */
.crew-pin { position: absolute; transform: translate(-50%, -18px); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.crew-pin .av { width: 34px; height: 34px; border-radius: 50%; border: 3px solid; background: #282b32; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.crew-pin .av img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
.crew-pin.me .av { width: 40px; height: 40px; }
.crew-pin span { background: rgba(17,17,17,.85); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.km-pin { background: #111; color: #ddd; border: 1px solid #555; border-radius: 6px; font: 600 10px sans-serif;
  text-align: center; line-height: 16px; }
/* 棒次編號：外層 0×0 給 Leaflet 定位，內層置中；地圖容器的 pins-md／pins-lg 依縮放放大 */
.pin-wrap { overflow: visible; }
.pin { position: absolute; transform: translate(-50%, -50%); background: #111; color: #ddd; border: 1px solid #666;
  border-radius: 7px; font: 700 13px/1 sans-serif; padding: 4px 6px; white-space: nowrap; }
.pin.major { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 14px; }
.pins-md .pin { font-size: 17px; padding: 5px 8px; }
.pins-lg .pin { font-size: 22px; padding: 6px 11px; border-radius: 9px; }
/* 進行中的棒次：虛線往前流動＋光暈呼吸 */
.leg-run { animation: leg-flow 0.8s linear infinite; }
@keyframes leg-flow { to { stroke-dashoffset: -22; } }
.leg-glow { animation: leg-breathe 1.6s ease-in-out infinite; }
@keyframes leg-breathe { 50% { stroke-opacity: .55; } }
.runner-pin { animation: runner-pulse 1.6s ease-out infinite; }
@keyframes runner-pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.6); } 100% { box-shadow: 0 0 0 16px rgba(255,255,255,0); } }
.runner-pin { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.25); }
.runner-pin.img { width: 44px; height: 44px; background: #282b32; border-width: 3px; overflow: hidden; }
.runner-pin.img img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: pixelated; }
.rules .kv { align-items: flex-start; gap: 12px; }
.rules .kv b { white-space: nowrap; }
.rules .kv span { font-size: 13px; text-align: right; }
.leaflet-container { font-family: inherit; }
.nav-ico { width: 1.1em; height: 1.1em; vertical-align: -0.15em; }
.nav-mini .nav-ico { width: 18px; height: 18px; color: #60a5fa; }
.shift .nav-mini { width: 32px; height: 32px; }
.hero.total .big { font-size: 34px; }
/* 「我」頁下一棒：倒數＋交棒圖示 */
.cd-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.cd-label { font-size: 14px; opacity: .9; }
.handoff { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0 10px; }
.handoff-arrow { width: 48px; height: 24px; opacity: .85; flex: none; }
.fig { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; min-width: 64px; }
.fig > img { height: 84px; width: auto; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.fig:not(.me) > img { opacity: .8; }
.fig .bib { background: #fff; border-radius: 7px;
  padding: 3px 7px; font-size: 13px; font-weight: 800; white-space: nowrap; max-width: 84px; overflow: hidden;
  text-overflow: ellipsis; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.fig .bib.start { color: #111; }
.handoff-time { text-align: center; font-size: 15px; }
.handoff-time b { font-size: 18px; }
.handoff-sub { text-align: center; font-size: 12px; margin-top: 4px; color: rgba(255,255,255,.85); }
.handoff-sub span { color: #fff; font-weight: 800; }
.car-pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 2px; padding: 3px 7px;
  border-radius: 9px; border: 2px solid #fff; color: #fff; font-size: 15px; box-shadow: 0 1px 6px rgba(0,0,0,.5); white-space: nowrap; }
.car-pin b { font-size: 13px; }
.car-pin.img { width: 42px; height: 42px; padding: 0; background: #282b32; overflow: hidden; border-width: 3px; }
.car-pin.img img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
#sheet select:disabled, #sheet input:disabled, #sheet button:disabled { opacity: .55; }
.dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }

/* 底部彈出視窗 */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000; display: none; }
.sheet-bg.open { display: block; }
/* 高度扣掉瀏海與網址列，標題列固定在頂端，捲動時「完成」不會被蓋住 */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80vh;
  max-height: calc(100dvh - env(safe-area-inset-top) - 32px); overflow-y: auto; background: var(--bg);
  border-radius: 20px 20px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin: 0 -16px 8px;
  padding: 16px 16px 10px; position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-head button { font-weight: 700; }
.sheet-head h3 { margin: 0; font-size: 18px; }
.sheet-head button { background: var(--card2); color: var(--accent); border-radius: 999px; padding: 6px 14px; }
select, input { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px; }
.pace-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pace-grid label { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--card);
  border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.pace-grid input { width: 76px; text-align: center; padding: 6px; }
.pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pick button { background: var(--card2); border-radius: 12px; padding: 14px 0; font-weight: 700; font-size: 18px; }
svg.elev { width: 100%; height: 110px; display: block; }
/* 第二版新增 */
a.btn { text-decoration: none; }
.badge.sm { width: 24px; height: 24px; font-size: 12px; border-radius: 7px; display: inline-flex; vertical-align: middle; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.dot.car1 { background: var(--car1); } .dot.car2 { background: var(--car2); }
.strip { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 10px; font-size: 14px; text-align: left; }
.strip .grow { flex: 1; min-width: 0; }
.night { background: #1e1b4b; color: #c7d2fe; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-top: 12px; }
.night b { color: #fff; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn-row .btn { font-size: 14px; padding: 12px 6px; }
.shift { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.shift:last-child { border-bottom: 0; }
.shift.done { opacity: .5; }
.shift .t { font-size: 13px; color: var(--muted); margin: 4px 0 0 32px; }
.shift .t b { color: var(--text); }
.order-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 8px; }
.order-grid label, .member-list label { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 10px; padding: 6px 8px; }
.order-grid select { flex: 1; min-width: 0; }
.member-list { display: grid; gap: 8px; }
.member-list label > span { width: 20px; text-align: center; }
.member-list input { flex: 1; min-width: 0; }
.member-list input.pace { flex: none; width: 76px; text-align: center; }
.issues.warn { background: var(--accent-bg); color: #fcd34d; }
.leg { cursor: pointer; }
.nav-mini { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--card2); display: flex;
  align-items: center; justify-content: center; text-decoration: none; font-size: 17px; }
select option:disabled { color: #666; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px); transform: translateX(-50%); background: #fff;
  color: #111; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 3000; display: none; }
</style>
</head>
<body>
<section id="tab-me" class="tab active"></section>
<section id="tab-map" class="tab">
  <div id="map"></div>
  <div class="map-card" id="map-card"></div>
  <div class="map-btns">
    <button id="btn-fit">全程</button>
    <button id="btn-follow">跑者</button>
    <button id="btn-crew">隊友</button>
    <button id="btn-base">街道</button>
  </div>
  <div id="map-demo"></div>
</section>
<section id="tab-legs" class="tab"></section>

<nav>
  <button data-tab="me" class="active"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4.5"/><path d="M3 21c0-4.4 4-7.5 9-7.5s9 3.1 9 7.5z"/></svg>我</button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z" opacity=".9"/></svg>地圖</button>
  <button data-tab="legs"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="14" cy="4" r="2.2"/><path d="M10 8.5l4-1.5 2.5 3.5 3 1-.6 1.8-4-1.3-1.4-1.9-1.2 3.6 2.7 2.4V22h-2v-5l-3-2.6-1.6 3.9L4 21l-.8-1.8 3.9-1.6 2.4-5.8-1.8.8-1 2.6-1.8-.7 1.4-3.6z"/></svg>棒次</button>
</nav>

<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- ?v= 改版時加一，避免手機讀到舊的快取 -->
<script src="data.js?v=8"></script>
<!-- 網址加 ?sim 進入模擬模式（假的 10 人比賽，不連真的資料庫） -->
<script>if (/[?&]sim\b/.test(location.search)) document.write('<script src="sim.js?v=2"><\/script>');</script>
<script src="app.js?v=13"></script>
</body>
</html>
